<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DM | Encontre uma loja perto de você</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Catamaran:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="cep-finder" aria-labelledby="cep-finder-title">
    <div class="cep-finder__panel">
      <span class="cep-finder__tab" aria-hidden="true"></span>
      <h2 id="cep-finder-title" class="cep-finder__title">
        Qual a loja DM®<br />mais perto de você?
      </h2>
      <p class="cep-finder__subtitle">
        Digite seu CEP e veja onde validar seu cartão DM®, sem dificuldades.
      </p>

      <form id="cep-form" class="cep-finder__form" novalidate>
        <label for="cep-input" class="cep-finder__label">Seu CEP</label>
        <div class="cep-finder__input-row">
          <input
            id="cep-input"
            name="cep"
            type="text"
            inputmode="numeric"
            placeholder="00000-000"
            maxlength="9"
            autocomplete="postal-code"
            aria-describedby="cep-feedback"
          />
          <button type="submit" id="cep-submit">Buscar</button>
        </div>
        <p id="cep-feedback" class="cep-finder__feedback" role="status" aria-live="polite"></p>
      </form>
    </div>

    <div id="results" class="cep-finder__results" aria-live="polite"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
