<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM - O Cartão que valoriza quem você é</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
             <img src="https://play-lh.googleusercontent.com/lzoSveaHXSO1BCWYEhKNGe4FFcyR73F9X3-5uPkH0ofuK0oXLhayqTXjYG6NxgjsoqS7BcqHV-mHKTRa25U2" alt="logo DM" class="logo-img">
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="cartoes.html">Nossos cartões</a></li>
                <li><a href="faq.html">Dúvidas</a></li>
            </ul>
        </nav>

        <button class="btn-header">Acessar status</button>
    </header>
    <div class="top-color-bar">
        <span class="bar-blue"></span>
        <span class="bar-yellow"></span>
        <span class="bar-pink"></span>
        <span class="bar-green"></span>
        <span class="bar-cyan"></span>
    </div>

    <!-- Conteúdo principal -->
    <main class="cards-container-page">
        <h1 class="page-title">SELECIONE O SEU CARTÃO:</h1>

        <div class="cards-grid">
            <!-- Card 1: Cartão DM -->
            <div class="card-box">
                <div class="card-header">CARTÃO LOJA VISA</div>
                <div class="card-visual">
                    <img src="/imagens/cartao2.png" alt="cartaodm" class="card-img">
                </div>
                <a href="#" class="btn-select">SELECIONAR</a>
            </div>

            <!-- Card 2: Cartão Loja -->
            <div class="card-box">
                <div class="card-header">CARTÃO LOJA</div>
                <div class="card-visual">
                    <img src="/imagens/cartao1.png" alt="cartaodm" class="card-img">
                </div>
                <a href="#" class="btn-select">SELECIONAR</a>
            </div>

            <!-- Card 3: Cartão Loja Digital -->
            <div class="card-box">
                <div class="card-header">CARTÃO DM</div>
                <div class="card-visual">
                    <img src="/imagens/cartao3.png" alt="cartaodm" class="card-img">
                </div>
                <a href="#" class="btn-select">SELECIONAR</a>
            </div>
        </div>
    </main>

</body>
</html>
